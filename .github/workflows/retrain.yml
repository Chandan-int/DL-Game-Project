# .github/workflows/retrain.yml
name: Retrain Difficulty Model

on:
  push:
    paths:
      - 'data/sessions.csv'
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch CPU
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install \
            mlflow \
            azure-ai-ml==1.33.0 \
            azure-identity \
            azure-storage-blob \
            pandas numpy

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Write azure_config.py
        run: |
          cat > azure_config.py << 'EOF'
          AZURE_CONFIG = {
              "subscription_id": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "resource_group":  "rg-game-ai-pipeline",
              "workspace_name":  "game-ai-mlops",
              "location":        "centralindia",
              "storage_account": "gameaimlstorage6275e6439",
              "data_container":  "game-telemetry",
              "model_name":      "DifficultyMLP",
              "endpoint_name":   "difficulty-endpoint",
              "deployment_name": "blue",
          }
          EOF

      - name: Write MLflow URI
        run: python ci/write_mlflow_uri.py

      - name: Upload sessions.csv to Azure Blob
        run: python upload_data.py

      - name: Retrain model
        run: python train_azure.py

      - name: Register best model
        run: python register_model.py

      - name: Update ACI with new model
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: python ci/update_aci.py

      - name: Test endpoint
        run: python test_endpoint.py